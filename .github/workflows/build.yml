name: Build Windows Exe

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller opencv-python requests pyautogui mss

    - name: Build Exe with PyInstaller
      run: |
        pyinstaller --onefile --name "TikTok_Captcha_Solver" captcha_monitor.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TikTok_Captcha_Solver_Exe
        path: dist/TikTok_Captcha_Solver.exe
